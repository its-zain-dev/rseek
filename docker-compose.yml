services:
  rseek:
    build: .
    container_name: rseek
    restart: unless-stopped
    ports:
      - "8080:8080"
    environment:
      RSEEK_HOST: "0.0.0.0"
      RSEEK_PORT: "8080"
      RSEEK_RATE_LIMIT: "60"
      RSEEK_CACHE_TTL: "300"
      # RSEEK_API_KEY: "change-me"
      # RSEEK_PROXY: "socks5://127.0.0.1:9050"
