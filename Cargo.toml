[package]
name = "rseek"
version = "0.1.1"
edition = "2021"
description = "Ultra-lightweight, free, zero-API-key Rust metasearch engine with HTTP API, Web UI, and Terminal CLI"
license = "MIT"
repository = "https://github.com/its-zain-dev/rseek"
readme = "README.md"
keywords = ["search", "metasearch", "cli", "api", "rust"]
categories = ["command-line-utilities", "web-programming::http-server"]

[dependencies]
axum = { version = "0.7", default-features = false, features = ["http1", "json", "query", "tokio"] }
clap = { version = "4", features = ["derive", "env"] }
futures = "0.3"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls-webpki-roots", "gzip", "deflate", "brotli", "json", "http2"] }
scraper = "0.20"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "time", "signal", "io-std", "io-util"] }
url = "2"

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
panic = "abort"
strip = true
